name: Build Tweach IPA

on:
  workflow_dispatch:
    inputs:

      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      tweak_url:
        description: "URL to the tweak file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "Twitch"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "tv.twitch"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4.1.1
        with:
          path: main
          submodules: recursive

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: display_name,bundle_id

      - name: Download and validate IPA
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O ${{ github.workspace }}/twitch.ipa

          file_type=$(file --mime-type -b ${{ github.workspace }}/twitch.ipa)

          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Download tweak
        run: |
          wget "${{ inputs.tweak_url }}" --no-verbose -O ${{ github.workspace }}/tweach.deb

      - name: Install Dependencies
        run: brew install make ldid

      - name: Set PATH environment variable
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject tweaks into IPA
        run: cyan -i twitch.ipa -o Tweach_30.3.1-2.3.3.ipa -uwef tweach.deb -n "${{ inputs.display_name }}" -b ${{ inputs.bundle_id }} -s

      - name: Strip embedded Swift dylibs
        run: |
          unzip -q Tweach_30.3.1-2.3.3.ipa -d tmp_payload
          find tmp_payload/Payload/*.app/ -name "libswift*.dylib" -print -delete
          cd tmp_payload
          zip -qr ../Tweach_30.3.1-2.3.3_clean.ipa Payload
          cd ..
          mv Tweach_30.3.1-2.3.3_clean.ipa Tweach_30.3.1-2.3.3.ipa

      - uses: softprops/action-gh-release@v2.0.1
        with:
          tag_name: Tweach_30.3.1-2.3.3
          name: Tweach_30.3.1-2.3.3
          files: Tweach_30.3.1-2.3.3.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
